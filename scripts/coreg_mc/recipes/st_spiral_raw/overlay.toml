seed = 20261017

[acquisition]
oversample = 2
matrix = [64, 64]
noise_variance = 0.0
# kz acceleration needs coils that differ along z; four coils in four rings is the minimum.
n_coils = 4
coil_rows = 4

[readout]
interleaves = 2
spiral_readout_time = 4.0
dwell_time = 1.0e-6
refocusing_flip_angle = 180.0
# The HMC probe set spiral_reconstruction = "gridding" here, from an aslscan build that no
# committed aslscan revision matches; the coregistration probe's pinned aslscan (bf58c8c) has no
# such setting, so this fixture uses aslscan's default spiral reconstruction (no gridding haze).
radial_oversampling = 1.0

[background_suppression]
presaturation = true
