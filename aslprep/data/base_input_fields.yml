# Derivative entities and sidecar metadata of ASLPrep outputs, keyed by the output name
# used in the workflows. Entity keys (desc, label, suffix, ...) name the file;
# capitalized keys (Units, Description, Levels) go into its JSON sidecar.
# Loaded as aslprep.workflows.asl.outputs.BASE_INPUT_FIELDS.

asl:
  desc: preproc
  suffix: asl

aslref:
  suffix: aslref

asl_mask:
  desc: brain
  suffix: mask

# CBF outputs
cbf_ts:
  desc: timeseries
  suffix: cbf
  Units: mL/100 g/min
  Description: Volume-wise cerebral blood flow, estimated by ASLPrep.

mean_cbf:
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow, estimated by ASLPrep.

att:
  suffix: att
  Units: s
  Description: >-
    Arterial transit time. The time from labeling until the labeled blood water first
    arrives in the voxel. It depends on where the labeling plane or slab was placed.
    Where a range of values fits the data equally well, this is one value from the
    range, and the ends of the range are in the desc-lower and desc-upper maps.

abat:
  suffix: abat
  Units: s
  Description: >-
    Arterial bolus arrival time. The time from labeling until the labeled blood water
    first arrives in the arteries within the voxel. This is not the tissue arterial
    transit time (att). The data only locate it within an interval set by the sampled
    delays, so this is the midpoint of that interval, and the ends of the interval
    are in the desc-lower and desc-upper maps.

abv:
  suffix: abv
  Units: fraction
  Description: >-
    Arterial blood volume. The fraction of the voxel occupied by the arterial vessel.
    For (P)CASL data, this value depends on the reported arterial bolus arrival time.

att_lower:
  desc: lower
  suffix: att
  Units: s
  Description: >-
    Lower bound of the arterial transit time. The shortest arterial transit time that
    fits the data as well as the estimate.

att_upper:
  desc: upper
  suffix: att
  Units: s
  Description: >-
    Upper bound of the arterial transit time. The longest arterial transit time that
    fits the data as well as the estimate.

att_lower_ci:
  desc: ciLower
  suffix: att
  Units: s
  Description: >-
    Lower end of a 95% profile-likelihood interval for the arterial transit time:
    the shortest ATT whose sum of squared errors, minimized over CBF, aBV, and aBAT,
    exceeds the minimum by at most 3.84 times the noise variance. The noise variance
    is pooled across voxels, so the interval assumes one noise level in delta-M.

att_upper_ci:
  desc: ciUpper
  suffix: att
  Units: s
  Description: >-
    Upper end of a 95% profile-likelihood interval for the arterial transit time
    (see desc-ciLower).

att_status:
  suffix: attstatus
  Description: >-
    How well the multi-delay fit located the arterial transit time, from its 95%
    interval (desc-ciLower and desc-ciUpper). Where ATT is not located, the att map
    should not be read as a measurement.
  Levels:
    '0': 'Not fitted: M0 is not positive or the data are not finite.'
    '1': 'Located: the interval is at most 0.5 s wide and does not reach 0 s.'
    '2': >-
      Bounded above only: the interval reaches 0 s, because the labeled blood may all
      have arrived before the earliest delay (including any slice-timing offset), and
      the data then only say that ATT is shorter than about that delay.
    '3': 'No tissue signal: CBF is zero, so ATT has no effect on the model.'
    '4': 'Not located: the interval is wider than 0.5 s.'

abat_lower:
  desc: lower
  suffix: abat
  Units: s
  Description: >-
    Lower bound of the arterial bolus arrival time. The shortest arterial bolus arrival
    time that fits the data as well as the estimate.

abat_upper:
  desc: upper
  suffix: abat
  Units: s
  Description: >-
    Upper bound of the arterial bolus arrival time. The longest arterial bolus arrival
    time that fits the data as well as the estimate.

abv_at_bound:
  desc: abvBound
  suffix: mask
  Description: >-
    Voxels where the fitted arterial blood volume is at its upper bound, the physical
    limit of 1. The arterial term could not absorb all of the arterial signal there,
    so what is left of it may bias the cerebral blood flow and arterial transit time.

abv_decayed:
  desc: decayed
  suffix: abv
  Units: fraction
  Description: >-
    Arterial blood volume multiplied by exp(-aBAT / T1blood), the decay of the label
    over the arterial bolus arrival time. Unlike the arterial blood volume itself,
    this product does not depend on where the arterial bolus arrival time falls between
    the two sampled delays that enclose it.

# SCORE/SCRUB outputs
cbf_ts_score:
  desc: scoreTimeseries
  suffix: cbf
  Units: mL/100 g/min
  Description: Volume-wise cerebral blood flow after SCORE denoising, estimated by
    ASLPrep.

mean_cbf_score:
  desc: score
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow after SCORE denoising, estimated by ASLPrep.

mean_cbf_scrub:
  desc: scrub
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow after SCORE and SCRUB denoising, estimated by ASLPrep.

# BASIL outputs
mean_cbf_basil:
  desc: basil
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow, estimated by BASIL.

mean_cbf_gm_basil:
  desc: basilGM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Cerebral blood flow after gray matter partial volume correction, estimated by
    BASIL.

mean_cbf_wm_basil:
  desc: basilWM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Cerebral blood flow after white matter partial volume correction, estimated by
    BASIL.

att_basil:
  desc: basil
  suffix: att
  Units: s
  Description: >-
    Arterial transit time, estimated by BASIL. The time from labeling until the labeled
    blood water first arrives in the voxel. It depends on where the labeling plane
    or slab was placed.

abv_basil:
  desc: basil
  suffix: abv
  Units: fraction
  Description: >-
    Arterial (cerebral) blood volume, estimated by BASIL. The fraction of the voxel
    occupied by the arterial vessel.

# BASIL posterior standard deviations
cbf_sd_basil:
  desc: basilSD
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Posterior standard deviation of the cerebral blood flow estimated by BASIL (desc-basil).
    The square root of the posterior variance written by BASIL.

cbf_gm_sd_basil:
  desc: basilGMSD
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Posterior standard deviation of the gray matter partial-volume corrected cerebral
    blood flow estimated by BASIL (desc-basilGM).

cbf_wm_sd_basil:
  desc: basilWMSD
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Posterior standard deviation of the white matter partial-volume corrected cerebral
    blood flow estimated by BASIL (desc-basilWM).

att_sd_basil:
  desc: basilSD
  suffix: att
  Units: s
  Description: >-
    Posterior standard deviation of the arterial transit time estimated by BASIL (desc-basil).

# Partial volume maps used by local-regression partial volume correction
gm_pv:
  label: GM
  desc: psf
  suffix: probseg
  Description: >-
    Gray matter fraction on the ASL reference grid, modelling the effective resolution
    of the ASL acquisition.

wm_pv:
  label: WM
  desc: psf
  suffix: probseg
  Description: >-
    White matter fraction on the ASL reference grid, modelling the effective resolution
    of the ASL acquisition.

csf_pv:
  label: CSF
  desc: psf
  suffix: probseg
  Description: >-
    CSF fraction on the ASL reference grid, modelling the effective resolution of
    the ASL acquisition.

# Local-regression partial volume correction (--pvc-method local-regression)
mean_cbf_gm_lr:
  desc: lrGM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Gray matter cerebral blood flow after partial volume correction by local linear
    regression: of the CBF map for single-delay data, or of each delta-M volume followed
    by a kinetic fit of each tissue curve for multi-delay data. Calibrated by the
    voxel's M0. Zero where it was not estimated.

cbf_gm_se_lr:
  desc: lrGMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the gray matter CBF estimated by local linear regression (desc-lrGM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

mean_cbf_wm_lr:
  desc: lrWM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    White matter cerebral blood flow after partial volume correction by local linear
    regression: of the CBF map for single-delay data, or of each delta-M volume followed
    by a kinetic fit of each tissue curve for multi-delay data. Calibrated by the
    voxel's M0. Zero where it was not estimated.

cbf_wm_se_lr:
  desc: lrWMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the white matter CBF estimated by local linear regression (desc-lrWM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

status_lr:
  desc: lr
  suffix: pvstatus
  Description: Outcome of the local-regression partial volume correction fit.
  Levels:
    '0': Outside the brain mask.
    '1': Gray and white matter fit.
    '2': Gray matter only fit (white matter contamination below the limit).
    '3': White matter only fit (gray matter contamination below the limit).
    '4': 'Not identifiable: too little tissue support, ill-conditioned, or no M0.'

condition_lr:
  desc: lr
  suffix: pvcondition
  Description: >-
    Condition number of the normalized gray/white matter Gram matrix of each local
    regression. Zero where undefined.

gm_noise_lr:
  desc: lrGM
  suffix: pvnoise
  Description: >-
    Noise amplification of the gray matter estimate: its standard error per unit of
    voxel noise, assuming independent noise.

wm_noise_lr:
  desc: lrWM
  suffix: pvnoise
  Description: >-
    Noise amplification of the white matter estimate: its standard error per unit
    of voxel noise, assuming independent noise.

rmse_lr:
  desc: lr
  suffix: pvrmse
  Description: >-
    Root mean square residual of each local regression, in units of the regressed
    signal: CBF times M0 for single-delay data, and delta-M (pooled over volumes)
    for multi-delay data. A spatial-regression diagnostic only.

mean_cbf_csf_lr:
  desc: lrCSF
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Apparent CSF cerebral blood flow, from a separate local regression on gray matter,
    white matter and CSF partial volume maps, for quality control: of the CBF map
    for single-delay data, or of each delta-M volume for multi-delay data, where the
    CSF curve is fit (with its sign) as a multiple of a unit-CBF tissue curve without
    an arterial term, at the voxel's uncorrected ATT (or the median uncorrected ATT
    where it was not estimated). CSF has no perfusion, so values far from zero
    indicate partial volume map errors, macrovascular or choroid plexus signal, or
    model error. The gray and white matter maps (desc-lrGM, desc-lrWM) do not come
    from this fit. Zero where it was not estimated. Valid in this (native) space only.

cbf_csf_se_lr:
  desc: lrCSFSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of desc-lrCSF, assuming independent, identically distributed noise
    and conditional on M0. Valid in this (native) space only.

status_csf_lr:
  desc: lrCSF
  suffix: pvstatus
  Description: Outcome of the CSF quality-control fit (desc-lrCSF).
  Levels:
    '0': Outside the brain mask.
    '1': Gray matter, white matter and CSF fit.
    '2': Gray matter and CSF fit (white matter contamination below the limit).
    '3': White matter and CSF fit (gray matter contamination below the limit).
    '4': Not identifiable.
    '5': CSF only fit (gray and white matter contamination below the limit).

csf_noise_lr:
  desc: lrCSF
  suffix: pvnoise
  Description: >-
    Noise amplification of the CSF estimate: its standard error per unit of voxel
    noise, assuming independent noise.

mean_cbf_gm_lr_score:
  desc: scoreLRGM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Gray matter cerebral blood flow after partial volume correction by local linear
    regression of the CBF map (desc-score). Zero where it was not estimated.

cbf_gm_se_lr_score:
  desc: scoreLRGMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the gray matter CBF estimated by local linear regression (desc-scoreLRGM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

mean_cbf_wm_lr_score:
  desc: scoreLRWM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    White matter cerebral blood flow after partial volume correction by local linear
    regression of the CBF map (desc-score). Zero where it was not estimated.

cbf_wm_se_lr_score:
  desc: scoreLRWMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the white matter CBF estimated by local linear regression (desc-scoreLRWM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

status_lr_score:
  desc: scoreLR
  suffix: pvstatus
  Description: Outcome of the local-regression partial volume correction fit.
  Levels:
    '0': Outside the brain mask.
    '1': Gray and white matter fit.
    '2': Gray matter only fit (white matter contamination below the limit).
    '3': White matter only fit (gray matter contamination below the limit).
    '4': 'Not identifiable: too little tissue support, ill-conditioned, or no M0.'

condition_lr_score:
  desc: scoreLR
  suffix: pvcondition
  Description: >-
    Condition number of the normalized gray/white matter Gram matrix of each local
    regression. Zero where undefined.

gm_noise_lr_score:
  desc: scoreLRGM
  suffix: pvnoise
  Description: >-
    Noise amplification of the gray matter estimate: its standard error per unit of
    voxel noise, assuming independent noise.

wm_noise_lr_score:
  desc: scoreLRWM
  suffix: pvnoise
  Description: >-
    Noise amplification of the white matter estimate: its standard error per unit
    of voxel noise, assuming independent noise.

rmse_lr_score:
  desc: scoreLR
  suffix: pvrmse
  Description: >-
    Root mean square residual of each local regression, in units of CBF times M0.

mean_cbf_csf_lr_score:
  desc: scoreLRCSF
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Apparent CSF cerebral blood flow, from a separate local regression on gray matter,
    white matter and CSF partial volume maps of the CBF map (desc-score), for quality
    control. CSF has no perfusion, so values far from zero indicate partial volume
    map errors, macrovascular or choroid plexus signal, or model error. The gray and
    white matter maps (desc-scoreLRGM, desc-scoreLRWM) do not come from this fit.
    Zero where it was not estimated. Valid in this (native) space only.

cbf_csf_se_lr_score:
  desc: scoreLRCSFSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of desc-scoreLRCSF, assuming independent, identically distributed
    noise and conditional on M0. Valid in this (native) space only.

status_csf_lr_score:
  desc: scoreLRCSF
  suffix: pvstatus
  Description: Outcome of the CSF quality-control fit (desc-scoreLRCSF).
  Levels:
    '0': Outside the brain mask.
    '1': Gray matter, white matter and CSF fit.
    '2': Gray matter and CSF fit (white matter contamination below the limit).
    '3': White matter and CSF fit (gray matter contamination below the limit).
    '4': Not identifiable.
    '5': CSF only fit (gray and white matter contamination below the limit).

csf_noise_lr_score:
  desc: scoreLRCSF
  suffix: pvnoise
  Description: >-
    Noise amplification of the CSF estimate: its standard error per unit of voxel
    noise, assuming independent noise.

att_gm_lr:
  desc: lrGM
  suffix: att
  Units: s
  Description: >-
    Gray matter arterial transit time from multi-delay local-regression partial volume
    correction: the kinetic fit of the tissue curve unmixed at each delay. Written
    only where that fit had positive CBF within its bounds; zero elsewhere. Check
    the native-space bounds (desc-lrGMLower_att, desc-lrGMUpper_att) for identifiability.

att_wm_lr:
  desc: lrWM
  suffix: att
  Units: s
  Description: >-
    White matter arterial transit time from multi-delay local-regression partial volume
    correction: the kinetic fit of the tissue curve unmixed at each delay. Written
    only where that fit had positive CBF within its bounds; zero elsewhere. Check
    the native-space bounds (desc-lrWMLower_att, desc-lrWMUpper_att) for identifiability.

att_gm_lower_lr:
  desc: lrGMLower
  suffix: att
  Units: s
  Description: >-
    Shortest gray matter arterial transit time that fits the tissue curve as well
    as desc-lrGM. Valid in this (native) space only.

att_gm_upper_lr:
  desc: lrGMUpper
  suffix: att
  Units: s
  Description: >-
    Longest gray matter arterial transit time that fits the tissue curve as well as
    desc-lrGM. Valid in this (native) space only.

att_wm_lower_lr:
  desc: lrWMLower
  suffix: att
  Units: s
  Description: >-
    Shortest white matter arterial transit time that fits the tissue curve as well
    as desc-lrWM. Valid in this (native) space only.

att_wm_upper_lr:
  desc: lrWMUpper
  suffix: att
  Units: s
  Description: >-
    Longest white matter arterial transit time that fits the tissue curve as well
    as desc-lrWM. Valid in this (native) space only.

kinstatus_gm_lr:
  desc: lrGM
  suffix: pvkinstatus
  Description: Outcome of the kinetic fit of the gray matter curve.
  Levels:
    '0': >-
      Not fitted: the spatial regression did not estimate this tissue, its partial
      volume is below 10%, or the voxel's M0 cannot calibrate it.
    '1': Fitted.
    '2': 'CBF at its lower bound (0): no positive tissue signal; ATT undefined.'
    '3': CBF at its upper bound; not written.
    '4': Input not finite.
    '5': >-
      Arterial blood volume at its upper bound: the remaining arterial signal would
      bias CBF and ATT, so neither is written.

kinstatus_wm_lr:
  desc: lrWM
  suffix: pvkinstatus
  Description: Outcome of the kinetic fit of the white matter curve.
  Levels:
    '0': >-
      Not fitted: the spatial regression did not estimate this tissue, its partial
      volume is below 10%, or the voxel's M0 cannot calibrate it.
    '1': Fitted.
    '2': 'CBF at its lower bound (0): no positive tissue signal; ATT undefined.'
    '3': CBF at its upper bound; not written.
    '4': Input not finite.
    '5': >-
      Arterial blood volume at its upper bound: the remaining arterial signal would
      bias CBF and ATT, so neither is written.

kinres_gm_lr:
  desc: lrGM
  suffix: pvkinres
  Description: >-
    Relative residual of the kinetic fit of the gray matter curve (norm of the curve
    minus the fitted model, divided by the norm of the curve). Large values point
    at kinetics the single-ATT model does not describe, such as arterial contamination
    or within-kernel ATT variation.

kinres_wm_lr:
  desc: lrWM
  suffix: pvkinres
  Description: >-
    Relative residual of the kinetic fit of the white matter curve (norm of the curve
    minus the fitted model, divided by the norm of the curve). Large values point
    at kinetics the single-ATT model does not describe, such as arterial contamination
    or within-kernel ATT variation.

csf_kinres_lr:
  desc: lrCSF
  suffix: pvkinres
  Description: >-
    Relative residual of the CSF curve against the fitted multiple of the unit-CBF
    tissue curve used for the multi-delay CSF quality-control estimate (desc-lrCSF_cbf).
