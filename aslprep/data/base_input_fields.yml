# Derivative entities and sidecar metadata of ASLPrep outputs, keyed by the output name
# used in the workflows. Entity keys (desc, label, suffix, ...) name the file;
# capitalized keys (Units, Description, Levels) go into its JSON sidecar.
# Loaded as aslprep.workflows.asl.outputs.BASE_INPUT_FIELDS.

asl:
  desc: preproc
  suffix: asl

aslref:
  suffix: aslref

asl_mask:
  desc: brain
  suffix: mask

# CBF outputs
cbf_ts:
  desc: timeseries
  suffix: cbf
  Units: mL/100 g/min
  Description: Volume-wise cerebral blood flow, estimated by ASLPrep.

mean_cbf:
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow, estimated by ASLPrep.

att:
  suffix: att
  Units: s
  Description: >-
    Arterial transit time. The time from labeling until the labeled blood water first
    arrives in the voxel. It depends on where the labeling plane or slab was placed.
    Where a range of values fits the data equally well, this is one value from the
    range, and the ends of the range are in the desc-lower and desc-upper maps.

abat:
  suffix: abat
  Units: s
  Description: >-
    Arterial bolus arrival time. The time from labeling until the labeled blood water
    first arrives in the arteries within the voxel. This is not the tissue arterial
    transit time (att). The data only locate it within an interval set by the sampled
    delays, so this is the midpoint of that interval, and the ends of the interval
    are in the desc-lower and desc-upper maps.

abv:
  suffix: abv
  Units: fraction
  Description: >-
    Arterial blood volume. The fraction of the voxel occupied by the arterial vessel.
    For (P)CASL data, this value depends on the reported arterial bolus arrival time.

att_lower:
  desc: lower
  suffix: att
  Units: s
  Description: >-
    Lower bound of the arterial transit time. The shortest arterial transit time that
    fits the data as well as the estimate.

att_upper:
  desc: upper
  suffix: att
  Units: s
  Description: >-
    Upper bound of the arterial transit time. The longest arterial transit time that
    fits the data as well as the estimate.

abat_lower:
  desc: lower
  suffix: abat
  Units: s
  Description: >-
    Lower bound of the arterial bolus arrival time. The shortest arterial bolus arrival
    time that fits the data as well as the estimate.

abat_upper:
  desc: upper
  suffix: abat
  Units: s
  Description: >-
    Upper bound of the arterial bolus arrival time. The longest arterial bolus arrival
    time that fits the data as well as the estimate.

abv_decayed:
  desc: decayed
  suffix: abv
  Units: fraction
  Description: >-
    Arterial blood volume multiplied by exp(-aBAT / T1blood), the decay of the label
    over the arterial bolus arrival time. Unlike the arterial blood volume itself,
    this product does not depend on where the arterial bolus arrival time falls between
    the two sampled delays that enclose it.

# SCORE/SCRUB outputs
cbf_ts_score:
  desc: scoreTimeseries
  suffix: cbf
  Units: mL/100 g/min
  Description: Volume-wise cerebral blood flow after SCORE denoising, estimated by
    ASLPrep.

mean_cbf_score:
  desc: score
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow after SCORE denoising, estimated by ASLPrep.

mean_cbf_scrub:
  desc: scrub
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow after SCORE and SCRUB denoising, estimated by ASLPrep.

# BASIL outputs
mean_cbf_basil:
  desc: basil
  suffix: cbf
  Units: mL/100 g/min
  Description: Cerebral blood flow, estimated by BASIL.

mean_cbf_gm_basil:
  desc: basilGM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Cerebral blood flow after gray matter partial volume correction, estimated by
    BASIL.

mean_cbf_wm_basil:
  desc: basilWM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Cerebral blood flow after white matter partial volume correction, estimated by
    BASIL.

att_basil:
  desc: basil
  suffix: att
  Units: s
  Description: >-
    Arterial transit time, estimated by BASIL. The time from labeling until the labeled
    blood water first arrives in the voxel. It depends on where the labeling plane
    or slab was placed.

abv_basil:
  desc: basil
  suffix: abv
  Units: fraction
  Description: >-
    Arterial (cerebral) blood volume, estimated by BASIL. The fraction of the voxel
    occupied by the arterial vessel.

# BASIL posterior standard deviations
cbf_sd_basil:
  desc: basilSD
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Posterior standard deviation of the cerebral blood flow estimated by BASIL (desc-basil).
    The square root of the posterior variance written by BASIL.

cbf_gm_sd_basil:
  desc: basilGMSD
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Posterior standard deviation of the gray matter partial-volume corrected cerebral
    blood flow estimated by BASIL (desc-basilGM).

cbf_wm_sd_basil:
  desc: basilWMSD
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Posterior standard deviation of the white matter partial-volume corrected cerebral
    blood flow estimated by BASIL (desc-basilWM).

att_sd_basil:
  desc: basilSD
  suffix: att
  Units: s
  Description: >-
    Posterior standard deviation of the arterial transit time estimated by BASIL (desc-basil).

# Partial volume maps used by local-regression partial volume correction
gm_pv:
  label: GM
  desc: psf
  suffix: probseg
  Description: >-
    Gray matter fraction on the ASL reference grid, modelling the effective resolution
    of the ASL acquisition.

wm_pv:
  label: WM
  desc: psf
  suffix: probseg
  Description: >-
    White matter fraction on the ASL reference grid, modelling the effective resolution
    of the ASL acquisition.

csf_pv:
  label: CSF
  desc: psf
  suffix: probseg
  Description: >-
    CSF fraction on the ASL reference grid, modelling the effective resolution of
    the ASL acquisition.

# Local-regression partial volume correction (--pvc-method local-regression)
mean_cbf_gm_lr:
  desc: lrGM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Gray matter cerebral blood flow after partial volume correction by local linear
    regression of the CBF map. Zero where it was not estimated.

cbf_gm_se_lr:
  desc: lrGMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the gray matter CBF estimated by local linear regression (desc-lrGM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

mean_cbf_wm_lr:
  desc: lrWM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    White matter cerebral blood flow after partial volume correction by local linear
    regression of the CBF map. Zero where it was not estimated.

cbf_wm_se_lr:
  desc: lrWMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the white matter CBF estimated by local linear regression (desc-lrWM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

status_lr:
  desc: lr
  suffix: pvstatus
  Description: Outcome of the local-regression partial volume correction fit.
  Levels:
    '0': Outside the brain mask.
    '1': Gray and white matter fit.
    '2': Gray matter only fit (white matter contamination below the limit).
    '3': White matter only fit (gray matter contamination below the limit).
    '4': 'Not identifiable: too little tissue support, ill-conditioned, or no M0.'

condition_lr:
  desc: lr
  suffix: pvcondition
  Description: >-
    Condition number of the normalized gray/white matter Gram matrix of each local
    regression. Zero where undefined.

gm_noise_lr:
  desc: lrGM
  suffix: pvnoise
  Description: >-
    Noise amplification of the gray matter estimate: its standard error per unit of
    voxel noise, assuming independent noise.

wm_noise_lr:
  desc: lrWM
  suffix: pvnoise
  Description: >-
    Noise amplification of the white matter estimate: its standard error per unit
    of voxel noise, assuming independent noise.

rmse_lr:
  desc: lr
  suffix: pvrmse
  Description: >-
    Root mean square residual of each local regression, in units of CBF times M0.

mean_cbf_csf_lr:
  desc: lrCSF
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Apparent CSF cerebral blood flow, from a separate local regression on gray matter,
    white matter and CSF partial volume maps of the CBF map, for quality control.
    CSF has no perfusion, so values far from zero indicate partial volume map errors,
    macrovascular or choroid plexus signal, or model error. The gray and white matter
    maps (desc-lrGM, desc-lrWM) do not come from this fit. Zero where it was not estimated.
    Valid in this (native) space only.

cbf_csf_se_lr:
  desc: lrCSFSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of desc-lrCSF, assuming independent, identically distributed noise
    and conditional on M0. Valid in this (native) space only.

status_csf_lr:
  desc: lrCSF
  suffix: pvstatus
  Description: Outcome of the CSF quality-control fit (desc-lrCSF).
  Levels:
    '0': Outside the brain mask.
    '1': Gray matter, white matter and CSF fit.
    '2': Gray matter and CSF fit (white matter contamination below the limit).
    '3': White matter and CSF fit (gray matter contamination below the limit).
    '4': Not identifiable.
    '5': CSF only fit (gray and white matter contamination below the limit).

csf_noise_lr:
  desc: lrCSF
  suffix: pvnoise
  Description: >-
    Noise amplification of the CSF estimate: its standard error per unit of voxel
    noise, assuming independent noise.

mean_cbf_gm_lr_score:
  desc: scoreLRGM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Gray matter cerebral blood flow after partial volume correction by local linear
    regression of the CBF map (desc-score). Zero where it was not estimated.

cbf_gm_se_lr_score:
  desc: scoreLRGMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the gray matter CBF estimated by local linear regression (desc-scoreLRGM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

mean_cbf_wm_lr_score:
  desc: scoreLRWM
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    White matter cerebral blood flow after partial volume correction by local linear
    regression of the CBF map (desc-score). Zero where it was not estimated.

cbf_wm_se_lr_score:
  desc: scoreLRWMSE
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Standard error of the white matter CBF estimated by local linear regression (desc-scoreLRWM),
    assuming independent, identically distributed noise and conditional on M0. Valid
    in this (native) space only.

status_lr_score:
  desc: scoreLR
  suffix: pvstatus
  Description: Outcome of the local-regression partial volume correction fit.
  Levels:
    '0': Outside the brain mask.
    '1': Gray and white matter fit.
    '2': Gray matter only fit (white matter contamination below the limit).
    '3': White matter only fit (gray matter contamination below the limit).
    '4': 'Not identifiable: too little tissue support, ill-conditioned, or no M0.'

condition_lr_score:
  desc: scoreLR
  suffix: pvcondition
  Description: >-
    Condition number of the normalized gray/white matter Gram matrix of each local
    regression. Zero where undefined.

gm_noise_lr_score:
  desc: scoreLRGM
  suffix: pvnoise
  Description: >-
    Noise amplification of the gray matter estimate: its standard error per unit of
    voxel noise, assuming independent noise.

wm_noise_lr_score:
  desc: scoreLRWM
  suffix: pvnoise
  Description: >-
    Noise amplification of the white matter estimate: its standard error per unit
    of voxel noise, assuming independent noise.

rmse_lr_score:
  desc: scoreLR
  suffix: pvrmse
  Description: >-
    Root mean square residual of each local regression, in units of CBF times M0.

mean_cbf_csf_lr_score:
  desc: scoreLRCSF
  suffix: cbf
  Units: mL/100 g/min
  Description: >-
    Apparent CSF cerebral blood flow, from a separate local regression on gray matter,
